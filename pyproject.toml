[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garch-fhs"
version = "0.1.0"
description = "GARCH / GJR-GARCH filtered historical simulation versus plain historical simulation for one-day VaR and ES."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amogh V Dixith" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "arch",
    "statsmodels",
]

[project.optional-dependencies]
dev = ["pytest"]
market = ["yfinance"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
